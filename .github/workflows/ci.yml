name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Compilation, règles d'architecture et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn verify
        run: ./mvnw -B verify
